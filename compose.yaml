# Local infrastructure for every course module.
#
#   docker compose --profile postgres up -d --wait     # one service
#   docker compose --profile all up -d --wait          # everything except Ollama
#   docker compose --profile ai up -d --wait           # PostgreSQL (pgvector) + Ollama
#   docker compose --profile all down -v               # stop and wipe data
#
# Profiles: postgres, mongo, elastic, redis, kafka, hazelcast, observability, ai, all
# Credentials are for local development only. Override them in a .env file (see .env.example).
# Ports are fixed so that tools (psql, mongosh, Kibana-less curl, IDE clients) work with default settings.
# Tests never use these containers — they start their own via Testcontainers.

name: spring-boot-edu

services:

  postgres:
    # PostgreSQL 18 with the pgvector extension (needed by 24-spring-ai; harmless elsewhere)
    image: pgvector/pgvector:0.8.6-pg18
    profiles: [postgres, ai, all]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookstore}
      POSTGRES_USER: ${POSTGRES_USER:-bookstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookstore}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    # Single-node replica set: required for multi-document transactions (07-data-mongodb).
    # The health check initiates the replica set on first start.
    image: mongo:8.0.32
    profiles: [mongo, all]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  elasticsearch:
    image: elasticsearch:9.4.5
    profiles: [elastic, all]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # local only — security is covered in 12-security
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  redis:
    image: redis:8.8.3-alpine
    profiles: [redis, all]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # KRaft mode (no ZooKeeper). Two listeners:
    #   localhost:9092 → applications running on the host (spring-boot:run)
    #   kafka:29092    → applications running inside this compose network
    image: apache/kafka:4.2.1
    profiles: [kafka, all]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  hazelcast:
    # Client-server topology (09-hazelcast). Embedded mode needs no container.
    image: hazelcast/hazelcast:5.5.0
    profiles: [hazelcast, all]
    environment:
      HZ_CLUSTERNAME: bookstore
      HZ_NETWORK_RESTAPI_ENABLED: "true"
      HZ_NETWORK_RESTAPI_ENDPOINTGROUPS_HEALTHCHECK_ENABLED: "true"
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "5701:5701"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5701/hazelcast/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  lgtm:
    # Grafana + Loki + Tempo + Prometheus/Mimir + OpenTelemetry Collector in one image (15-observability)
    #   Grafana UI: http://localhost:3000   OTLP: grpc 4317, http 4318
    image: grafana/otel-lgtm:0.33.1
    profiles: [observability, all]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama:
    # Local LLM runtime for 24-spring-ai. Not in "all": models are several GB.
    # Pull a model once: docker compose exec ollama ollama pull <model>
    image: ollama/ollama:0.34.3
    profiles: [ai]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  mongo-data:
  elastic-data:
  ollama-models:
