# The local cluster of modules 22, 23 and the capstone (created by scripts/kind-up.sh).
# One node is enough for a laptop; the image is pinned so that every student gets the same Kubernetes version.
# Images come in with "kind load docker-image" (no registry), the services are reached with "kubectl port-forward".
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bookstore
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
