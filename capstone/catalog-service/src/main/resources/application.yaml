spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/catalog}
  data:
    mongodb:
      representation:
        big-decimal: decimal128
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true                 # the trace context travels in the record headers …
    listener:
      observation-enabled: true                 # … and consumers continue the trace
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false     # plain JSON: consumers choose their own type
  grpc:
    server:
      port: ${GRPC_PORT:9090}
server:
  port: ${PORT:8082}                          # behind the gateway (8080)
bookstore:
  hazelcast:
    address: ${HAZELCAST_ADDRESS:localhost:5701}
  jwt:
    secret: ${BOOKSTORE_JWT_SECRET}       # no default: compose.yaml / the Helm chart set it
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true                           # /actuator/health/liveness and /readiness (Docker, Kubernetes)
  tracing:
    sampling:
      probability: 1.0                          # every request is traced (production: e.g. 0.1)
  metrics:
    tags:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
