spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/catalog}
  data:
    mongodb:
      representation:
        big-decimal: decimal128
  hazelcast:
    config: classpath:hazelcast-client.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false     # plain JSON: consumers choose their own type
  grpc:
    server:
      port: ${GRPC_PORT:9090}
server:
  port: ${PORT:8082}                          # behind the gateway (8080)
bookstore:
  jwt:
    secret: ${BOOKSTORE_JWT_SECRET}       # no default: compose.yaml / the Helm chart set it
management:
  endpoints:
    web:
      exposure:
        include: health,info
