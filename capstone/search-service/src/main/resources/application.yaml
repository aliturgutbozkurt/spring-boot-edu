spring:
  application:
    name: search-service
  threads:
    virtual:
      enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true                 # the trace context travels in the record headers …
    listener:
      observation-enabled: true                 # … and consumers continue the trace
    consumer:
      auto-offset-reset: earliest               # a new read model starts from the first event
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false     # plain JSON; each listener names its type
        spring.json.trusted.packages: com.springbootedu.capstone.contracts.events
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8083}                          # behind the gateway (8080)
bookstore:
  search:
    cache-ttl: 60s                              # ADR-7: results are cached briefly; index updates evict them
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true                           # /actuator/health/liveness and /readiness (Docker, Kubernetes)
  tracing:
    sampling:
      probability: 1.0                          # every request is traced (production: e.g. 0.1)
  metrics:
    tags:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
