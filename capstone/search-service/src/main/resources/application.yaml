spring:
  application:
    name: search-service
  threads:
    virtual:
      enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest               # a new read model starts from the first event
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false     # plain JSON; each listener names its type
        spring.json.trusted.packages: com.springbootedu.capstone.contracts.events
  mvc:
    problemdetails:
      enabled: true
bookstore:
  search:
    cache-ttl: 60s                              # ADR-7: results are cached briefly; index updates evict them
management:
  endpoints:
    web:
      exposure:
        include: health,info
