# Lesson 3.7 — the catalog and the order service on Kubernetes, with Spring Cloud Kubernetes instead of
# the Config Server and the fixed instance list.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookstore-cloud
resources:
  - namespace.yaml
  - rbac.yaml
  - catalog.yaml
  - order-service.yaml
