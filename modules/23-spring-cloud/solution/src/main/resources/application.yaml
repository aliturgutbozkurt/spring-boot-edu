spring:
  application:
    name: 23-spring-cloud-exercises
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog
              uri: lb://catalog-service
              predicates:
                - Path=/api/books/**
            # exercise 1: the review service
            - id: reviews
              uri: lb://review-service
              predicates:
                - Path=/api/reviews/**
              filters:
                # exercise 2: a circuit breaker with a fallback; 5xx answers count as failures
                - name: CircuitBreaker
                  args:
                    name: reviews
                    fallbackUri: forward:/fallback/reviews
                    statusCodes:
                      - 500
                      - 503
    discovery:
      client:
        simple:
          instances:
            catalog-service:
              - uri: http://localhost:8081
            review-service:
              - uri: http://localhost:8083
bookstore:
  gateway:
    api-key: ${BOOKSTORE_API_KEY:dev-key}          # a dev value only
resilience4j:
  circuitbreaker:
    instances:
      reviews:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
logging:
  level:
    root: warn
