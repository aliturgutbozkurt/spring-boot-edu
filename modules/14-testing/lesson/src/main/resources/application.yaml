spring:
  application:
    name: 14-testing
  threads:
    virtual:
      enabled: true
  # All modules share the "bookstore" database of compose.yaml; this one uses the schema "testing".
  flyway:
    schemas: testing
  datasource:
    hikari:
      schema: testing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # tag::payment-config[]
  http:
    serviceclient:
      payment:                              # @ImportHttpServices(group = "payment")
        base-url: ${PAYMENT_URL:http://localhost:9090}
        read-timeout: 2s
  # end::payment-config[]
  docker:
    compose:
      # Reuse the root compose.yaml; only the listed profiles are started.
      file: ../../../compose.yaml
      profiles:
        active: postgres
      # Keep containers running between restarts (stop them with: docker compose --profile all down)
      lifecycle-management: start-only
      # Run "docker compose up" even if another module already started some services:
      # it is idempotent and starts only what is missing (default "if-running" would skip it)
      start:
        skip: never
