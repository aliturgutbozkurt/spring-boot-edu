# Exercise 2 — the bookstore, its database and the warehouse as one system.
name: bookstore-exercise

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookstore}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  warehouse:                                   # stands for an external service; the app only checks port 80
    image: nginx:1.29-alpine

  app:
    build: .
    ports:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookstore
      SPRING_DATASOURCE_USERNAME: bookstore
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bookstore}
      BOOKSTORE_WAREHOUSE_HOST: warehouse
      BOOKSTORE_WAREHOUSE_PORT: "80"
    depends_on:
      postgres:
        condition: service_healthy
      warehouse:
        condition: service_started
