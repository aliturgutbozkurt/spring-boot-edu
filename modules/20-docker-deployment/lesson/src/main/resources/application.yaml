spring:
  application:
    name: 20-docker-deployment
  threads:
    virtual:
      enabled: true
  flyway:
    schemas: deployment
  datasource:
    hikari:
      schema: deployment
  mvc:
    problemdetails:
      enabled: true
  # tag::graceful[]
  lifecycle:
    timeout-per-shutdown-phase: 20s     # how long running requests may still take after SIGTERM
  # end::graceful[]
  docker:
    compose:
      # Reuse the root compose.yaml; only the listed profiles are started.
      file: ../../../compose.yaml
      profiles:
        active: postgres
      # Keep containers running between restarts (stop them with: docker compose --profile all down)
      lifecycle-management: start-only
      # Run "docker compose up" even if another module already started some services:
      # it is idempotent and starts only what is missing (default "if-running" would skip it)
      start:
        skip: never
# tag::probes[]
server:
  shutdown: graceful                    # the default since Boot 3.4 — written here to make it visible
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true                   # /actuator/health/liveness and /readiness (the default in Boot 4)
      group:
        readiness:
          include: readinessState,db    # not ready without the database …
        liveness:
          include: livenessState        # … but still alive: a restart would not bring the database back
# end::probes[]
