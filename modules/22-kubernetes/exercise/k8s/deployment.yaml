apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore
spec:
  replicas: 2
  # TODO 2c: keep at least 3 old versions to roll back to
  selector:
    matchLabels:
      app: bookstore
  # TODO 2a: a rolling update that never removes a ready pod before its replacement is ready (one new pod at a time)
  template:
    metadata:
      labels:
        app: bookstore
    spec:
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:0.8.6-pg18
          command: ["sh", "-c", "until pg_isready -h postgres -U bookstore -d bookstore; do sleep 2; done"]
      containers:
        - name: bookstore
          image: springbootedu/kubernetes:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bookstore-config
            - secretRef:
                name: bookstore-db
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/bookstore
          resources:
            requests:                      # TODO 3a: request 200m CPU — the HPA computes percentages of it
              memory: 384Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
          # TODO 2b: a readiness probe on the Actuator readiness group, so that a broken version gets no traffic
