# The exercises: the lesson's image in its own namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookstore-exercise
resources:
  - namespace.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml                               # exercise 3
configMapGenerator:                        # exercise 1: a change creates a new name → the pods roll
  - name: bookstore-config
    literals:
      - BOOKSTORE_SHOP_NAME=Exercise shop
secretGenerator:
  - name: bookstore-db
    literals:
      - SPRING_DATASOURCE_USERNAME=bookstore
      - SPRING_DATASOURCE_PASSWORD=bookstore
