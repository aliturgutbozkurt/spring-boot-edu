apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore
spec:
  replicas: 2
  revisionHistoryLimit: 5                  # exercise 2: old ReplicaSets to roll back to
  selector:
    matchLabels:
      app: bookstore
  strategy:                                # exercise 2: never fewer ready pods than wanted
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: bookstore
    spec:
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:0.8.6-pg18
          command: ["sh", "-c", "until pg_isready -h postgres -U bookstore -d bookstore; do sleep 2; done"]
      containers:
        - name: bookstore
          image: springbootedu/kubernetes:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bookstore-config
            - secretRef:
                name: bookstore-db
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/bookstore
          resources:
            requests:
              cpu: 200m                    # exercise 3: the HPA computes percentages of this
              memory: 384Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
          readinessProbe:                  # exercise 2: a broken version never becomes ready → gets no traffic
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
