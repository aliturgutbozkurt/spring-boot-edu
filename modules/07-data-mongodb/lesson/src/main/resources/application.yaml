spring:
  application:
    name: 07-data-mongodb
  threads:
    virtual:
      enabled: true
  # tag::mongo-config[]
  mongodb:
    database: bookstore                    # Boot 4: connection settings live under spring.mongodb.*
  data:
    mongodb:
      auto-index-creation: true            # create @Indexed / @TextIndexed indexes at startup
      representation:
        big-decimal: decimal128            # exact decimals (the current default) — stated explicitly
  # end::mongo-config[]
  docker:
    compose:
      # Reuse the root compose.yaml; only the listed profiles are started.
      file: ../../../compose.yaml
      profiles:
        active: mongo
      # Keep containers running between restarts (stop them with: docker compose --profile all down)
      lifecycle-management: start-only

logging:
  level:
    root: warn
    com.springbootedu: info
