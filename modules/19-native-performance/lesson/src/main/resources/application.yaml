spring:
  application:
    name: 19-native-performance
  threads:
    virtual:
      enabled: true
  flyway:
    schemas: nativeperf
  datasource:
    hikari:
      schema: nativeperf
  mvc:
    problemdetails:
      enabled: true
  docker:
    compose:
      # Reuse the root compose.yaml; only the listed profiles are started.
      file: ../../../compose.yaml
      profiles:
        active: postgres
      # Keep containers running between restarts (stop them with: docker compose --profile all down)
      lifecycle-management: start-only
      # Run "docker compose up" even if another module already started some services:
      # it is idempotent and starts only what is missing (default "if-running" would skip it)
      start:
        skip: never
bookstore:
  price-format:
    class-name: com.springbootedu.nativeperformance.price.TurkishLiraFormat
