spring:
  application:
    name: 12-security
  threads:
    virtual:
      enabled: true
  # All modules share the "bookstore" database of compose.yaml. Each one keeps its tables and its Flyway
  # history in its own schema, so running one module never breaks another.
  flyway:
    schemas: security
  datasource:
    hikari:
      schema: security
  # tag::authorization-server[]
  security:
    oauth2:
      authorizationserver:
        client:
          bookstore-cli:                           # a machine client (e.g. a script or another service)
            registration:
              client-id: bookstore-cli
              # {noop}: stored as plain text — acceptable only for this local demo; override it with the
              # environment variable BOOKSTORE_CLI_SECRET
              client-secret: "${BOOKSTORE_CLI_SECRET:{noop}dev-only-secret}"
              client-authentication-methods: client_secret_basic
              authorization-grant-types: client_credentials
              scopes: books.read,books.write
  # end::authorization-server[]
  docker:
    compose:
      # Reuse the root compose.yaml; only the listed profiles are started.
      file: ../../../compose.yaml
      profiles:
        active: postgres
      # Keep containers running between restarts (stop them with: docker compose --profile all down)
      lifecycle-management: start-only
      # Run "docker compose up" even if another module already started some services:
      # it is idempotent and starts only what is missing (default "if-running" would skip it)
      start:
        skip: never
bookstore:
  cors:
    allowed-origins: http://localhost:5173       # a browser front end on another origin (e.g. Vite)
logging:
  level:
    root: warn
    com.springbootedu: info
